[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "aegisscan"
version = "0.1.0"
description = "Web application security scanner for authorized testing: recon plus non-destructive vulnerability detection."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Ali Syed Rasheed" }]
dependencies = [
    "httpx>=0.27",
    "dnspython>=2.6",
    "typer>=0.12",
    "pydantic>=2.6",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "cryptography>=42",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]

[project.scripts]
aegisscan = "aegisscan.cli:app"

[tool.setuptools.packages.find]
include = ["aegisscan*"]

[tool.setuptools.package-data]
aegisscan = ["report/templates/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:ssl"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
